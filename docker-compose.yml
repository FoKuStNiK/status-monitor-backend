services:
  backend:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./server/data:/app/server/data
    expose:
      - "5000"
    restart: unless-stopped

  web:
    build:
      context: ../status-monitor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
